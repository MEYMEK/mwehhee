<!doctype html>
<html lang="id">


<head>

    <meta charset="UTF-8">


    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400..700&display=swap" rel="stylesheet">

    <title>
        Surat Rahasia
    </title>


    <link 
        rel="stylesheet" 
        href="style.css"
    >

</head>



<body>

    
    <main class="container">


        <!-- ======================
             AMPLOP
        ======================= -->


        <section class="envelope">


            <!-- Bagian belakang amplop -->

            <div class="envelope-back"></div>



            <!-- Bagian depan amplop -->

            <div class="envelope-front"></div>



            <!-- Tutup amplop -->

            <div class="envelope-flap"></div>


        </section>







        <!-- ======================
             KERTAS SURAT
        ======================= -->


        <section class="paper">


            <header class="letter-header">


                <h1>
                    Surat Rahasia
                </h1>


            </header>





            <article class="letter-content">


                <p>
                    Halo Maulana,
                </p>



                <p>
                    Ini adalah isi surat.
                    Pesan ini nantinya bisa berasal dari backend.
                </p>



                <p>
                    - Sistem
                </p>



            </article>


        </section>








        <!-- ======================
             PENGUNCI AMPLOP
        ======================= -->


<button class="ribbon">
    <img src="foto/pita.svg" alt="Ribbon">
</button>





    </main>







    <!-- ======================
         AUDIO BACKGROUND
    ======================= -->


<audio id="music">
    <source src="a.mp3" type="audio/mpeg">
</audio>








    <!-- ======================
         MEMORY FLOWER POPUP
         Foto akan dimasukkan JS
    ======================= -->


    <div class="memory"></div>
    
    <canvas id="canvas"></canvas>

    


    <script src="script.js"></script>



</body>


</html>
