<!doctype html>
<html lang="id">


<head>

    <meta charset="UTF-8">


    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >


    <title>
        Surat Rahasia
    </title>


    <link 
        rel="stylesheet" 
        href="style.css"
    >

</head>



<body>


    <main class="container">


        <!-- ======================
             AMPLOP
        ======================= -->


        <section class="envelope">


            <!-- Bagian belakang amplop -->

            <div class="envelope-back"></div>



            <!-- Bagian depan amplop -->

            <div class="envelope-front"></div>



            <!-- Tutup amplop -->

            <div class="envelope-flap"></div>


        </section>







        <!-- ======================
             KERTAS SURAT
        ======================= -->


        <section class="paper">


            <header class="letter-header">


                <h1>
                    Surat Rahasia
                </h1>


            </header>





            <article class="letter-content">


                <p>
                    Halo Maulana,
                </p>



                <p>
                    Ini adalah isi surat.
                    Pesan ini nantinya bisa berasal dari backend.
                </p>



                <p>
                    - Sistem
                </p>



            </article>


        </section>








        <!-- ======================
             PENGUNCI AMPLOP
        ======================= -->


        <button
            class="ribbon"
            aria-label="Buka surat">


            🎀


        </button>





    </main>







    <!-- ======================
         AUDIO BACKGROUND
    ======================= -->


    <audio
        id="music"
        src="assets/music.mp3">

    </audio>








    <!-- ======================
         MEMORY FLOWER POPUP
         Foto akan dimasukkan JS
    ======================= -->


    <div class="memory">


    </div>








    <script src="script.js"></script>



</body>


</html>
